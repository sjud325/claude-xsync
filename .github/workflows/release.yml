name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml version
        run: |
          pkg=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          case "$GITHUB_REF_NAME" in
            "v$pkg"|"v$pkg"-*) echo "tag $GITHUB_REF_NAME matches package $pkg" ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $pkg (binaries would report the wrong --version)"; exit 1 ;;
          esac
      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "claude-xsync $GITHUB_REF_NAME" \
            --notes "See README for install and usage." || true

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            ext: .exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross_linker: aarch64-linux-gnu-gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker
        if: matrix.cross_linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="claude-xsync-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/claude-xsync${{ matrix.ext }}" "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          shasum -a 256 * > ../checksums.txt
          cd ..
          gh release upload "$GITHUB_REF_NAME" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber

  # The tawanorg lesson (spec §9): a release with silently-missing binaries
  # must FAIL loudly. 6 binaries + checksums.txt = 7 assets, or the run is red.
  verify-assets:
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - name: Verify release asset count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')
          echo "release assets: $count"
          if [ "$count" -lt 7 ]; then
            echo "::error::expected at least 7 release assets (6 binaries + checksums.txt), got $count"
            exit 1
          fi
