[package]
name = "claude-xsync"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
age = "0.10"
flate2 = "1"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
dirs = "5"
thiserror = "1"
anyhow = "1"
tempfile = "3"
toml = "0.8"
hex = "0.4"
sysinfo = "0.30"

[dev-dependencies]
proptest = "1"
